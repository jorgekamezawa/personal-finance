name: deploy

# Puts one published version on the server. Rolling back is running it with the previous version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'commit to deploy, 7 characters or more (empty = latest on main)'
        type: string
        required: false

permissions:
  contents: read
  # Lets the job ask for the identity token the private network trusts; no secret is stored for it.
  id-token: write

# Shares the group with server up and down: a deploy never runs while the server is changing.
concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-job.yml
    with:
      version: ${{ inputs.version }}
