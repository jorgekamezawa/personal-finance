name: CI

# While the suite is fast, every job runs on every PR, with no per-folder filter.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: docs
    # Pinned version, not the moving label: a new red means code, not a different machine.
    runs-on: ubuntu-24.04
    # Without a limit, a hung step holds the check for six hours, the platform default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test the check scripts
        run: python3 -m unittest discover -s .claude/scripts -p 'test_*.py' -v
      - name: Check documents against the standard
        run: python3 .claude/scripts/check_docs.py

  code:
    name: code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check code against the conventions
        run: python3 .claude/scripts/check_code.py

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # One invocation only: every Gradle start costs close to ten seconds.
      # The formatter just checks; fixing would mean pushing from the workflow.
      # Testcontainers uses the Docker the CI machine already provides.
      - name: Check formatting and test
        run: ./gradlew spotlessCheck test --no-daemon
        working-directory: backend

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # The build catches what types and tests do not, such as an import that only fails when packaging.
      - run: npm run build
        working-directory: frontend

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      # No backend: validating needs the plugins, not the state nor any credential.
      - name: Validate the persistent layer
        run: |
          terraform -chdir=infra/persistent init -backend=false
          terraform -chdir=infra/persistent validate

  images:
    name: images
    # The suite is the gate: nothing is built for publishing unless every other job passed.
    needs: [docs, code, backend, frontend, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      # One broken image must not hide the state of the other.
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # A pull request only proves the image builds; publishing happens on main alone.
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # The commit id is the only tag: a moving label could deploy an older image unnoticed.
          tags: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.sha }}
          # Links the package to this repository on GitHub.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Scoped per image, otherwise the two builds overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
